[project]
name = "db-trace"
version = "0.1.0"
description = "DB-TRACE: AI-Driven Contextual Risk Detection and Verified Remediation for Cloud Database Security"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "faker>=33.0",
    "networkx>=3.4",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "shap>=0.46",
    "torch>=2.5",
    "torch-geometric>=2.6",
    "neo4j>=5.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "mlflow>=2.18",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]
iam = [
    "policyuniverse>=1.5",
    "cloudsplaining>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbtrace"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

